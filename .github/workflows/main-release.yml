name: Main release gate

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_development_migration:
        description: Re-run the development migration and synthetic seed after a reviewed main release
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

jobs:
  release:
    name: Main release gate
    runs-on: ubuntu-latest
    env:
      # The browser DSN is public runtime configuration, but must be supplied
      # at build time so the client bundle can initialize Better Stack Errors.
      VITE_BETTER_STACK_DSN: ${{ secrets.VITE_BETTER_STACK_DSN }}
    outputs:
      drizzle_changed: ${{ steps.changes.outputs.drizzle_changed }}
    steps:
      - name: Wait for earlier main release gates
        uses: actions/github-script@v7
        with:
          script: |
            const current = Number(process.env.GITHUB_RUN_NUMBER)
            while (true) {
              const statuses = ['queued', 'in_progress']
              const active = (await Promise.all(statuses.map((status) =>
                github.paginate(github.rest.actions.listWorkflowRuns, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: 'main-release.yml',
                  branch: 'main',
                  status,
                  per_page: 100,
                })
              ))).flat()
              const earlier = active.filter(
                (run) => run.run_number < current && run.status !== 'completed',
              )
              if (earlier.length === 0) break
              core.info(`Waiting for ${earlier.length} earlier main release gate(s).`)
              await new Promise((resolve) => setTimeout(resolve, 15000))
            }
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - id: changes
        name: Detect Drizzle changes
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "drizzle_changed=${{ inputs.run_development_migration }}" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "${{ github.event.before }}" "${{ github.sha }}" -- drizzle/; then
            echo "drizzle_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "drizzle_changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Run complete release verification
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            quality_base=HEAD^
          else
            quality_base=${{ github.event.before }}
          fi
          QUALITY_BASE="$quality_base" bun run quality:release

  migrate-development:
    name: Migrate and seed development
    needs: release
    if: needs.release.outputs.drizzle_changed == 'true'
    runs-on: ubuntu-latest
    environment: development
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_ENVIRONMENT: development
      SUPABASE_PRODUCTION_PROJECT_REF: ${{ vars.SUPABASE_PRODUCTION_PROJECT_REF }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DEVELOPMENT_SEED_EMAIL: ${{ vars.DEVELOPMENT_SEED_EMAIL }}
      DEVELOPMENT_SEED_PASSWORD: ${{ secrets.DEVELOPMENT_SEED_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - name: Apply pending migrations to development
        run: bun run db:migrate
      - name: Apply idempotent synthetic development seed
        run: bun run db:seed:development

  preproduction:
    name: Deploy and verify pre-production
    needs: [release, migrate-development]
    if: >-
      ${{
        always() &&
        needs.release.result == 'success' &&
        needs.migrate-development.result != 'failure' &&
        needs.migrate-development.result != 'cancelled' &&
        vars.PREPRODUCTION_GATE_ENABLED == 'true'
      }}
    runs-on: ubuntu-latest
    environment: pre-production
    timeout-minutes: 30
    outputs:
      version_id: ${{ steps.upload.outputs.version_id }}
      tag: ${{ steps.identity.outputs.tag }}
    env:
      PREPRODUCTION_WORKER_NAME: ${{ vars.PREPRODUCTION_WORKER_NAME || 'christ-dina-preproduction' }}
      PREPRODUCTION_ORIGIN: ${{ vars.PREPRODUCTION_ORIGIN }}
      PREPRODUCTION_HYPERDRIVE_ID: ${{ vars.PREPRODUCTION_HYPERDRIVE_ID }}
      PREPRODUCTION_JOURNEY_PATHS: ${{ vars.PREPRODUCTION_JOURNEY_PATHS }}
      SUPABASE_PRODUCTION_PROJECT_REF: ${{ vars.SUPABASE_PRODUCTION_PROJECT_REF }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      RESEND_FROM: ${{ vars.RESEND_FROM }}
      # WhatsApp is explicitly disabled in pre-production: no genuine Meta
      # credentials exist, so sends fail before any network call while email
      # smoke checks still exercise Resend.
      WHATSAPP_ENABLED: 'false'
      WHATSAPP_API_VERSION: ${{ vars.WHATSAPP_API_VERSION || 'v21.0' }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      VITE_BETTER_STACK_DSN: ${{ secrets.VITE_BETTER_STACK_DSN }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - id: identity
        name: Validate pre-production isolation inputs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PREPRODUCTION_ACCESS_CLIENT_ID: ${{ secrets.PREPRODUCTION_ACCESS_CLIENT_ID }}
          PREPRODUCTION_ACCESS_CLIENT_SECRET: ${{ secrets.PREPRODUCTION_ACCESS_CLIENT_SECRET }}
        run: |
          for name in \
            PREPRODUCTION_WORKER_NAME PREPRODUCTION_ORIGIN \
            PREPRODUCTION_HYPERDRIVE_ID PREPRODUCTION_JOURNEY_PATHS \
            CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN \
            PREPRODUCTION_ACCESS_CLIENT_ID PREPRODUCTION_ACCESS_CLIENT_SECRET \
            SUPABASE_PRODUCTION_PROJECT_REF SUPABASE_URL \
            RESEND_FROM WHATSAPP_ENABLED \
            VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "$name is not configured for the pre-production environment"
              exit 1
            fi
          done
          bun run scripts/release-policy.ts validate-url --url "$PREPRODUCTION_ORIGIN"
          if [[ "$PREPRODUCTION_ORIGIN" == *"christ-dina.org"* ]]; then
            echo "PREPRODUCTION_ORIGIN must not use the production domain"
            exit 1
          fi
          if [[ "$VITE_SUPABASE_URL" == *"$SUPABASE_PRODUCTION_PROJECT_REF"* ]]; then
            echo "VITE_SUPABASE_URL must not point at the production Supabase project"
            exit 1
          fi
          if [[ "$SUPABASE_URL" == *"$SUPABASE_PRODUCTION_PROJECT_REF"* ]]; then
            echo "SUPABASE_URL must not point at the production Supabase project"
            exit 1
          fi
          target_sha=$(git rev-parse HEAD)
          echo "tag=pre-$target_sha" >> "$GITHUB_OUTPUT"
          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"
      - name: Generate the isolated pre-production Worker config
        run: bun run scripts/preproduction-wrangler-config.ts
      - name: Build the pre-production artifact
        env:
          VITE_APP_VERSION: ${{ steps.identity.outputs.tag }}
          VITE_SENTRY_ENVIRONMENT: preview
        run: bun run build
      - id: upload
        name: Upload the pre-production Worker version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREPROD_TAG: ${{ steps.identity.outputs.tag }}
          TARGET_SHA: ${{ steps.identity.outputs.target_sha }}
        run: |
          bunx wrangler versions upload dist/server/index.js \
            --config wrangler.preproduction.generated.jsonc \
            --no-bundle \
            --name "$PREPRODUCTION_WORKER_NAME" \
            --tag "$PREPROD_TAG" \
            --message "Pre-production gate $TARGET_SHA" \
            --var "RELEASE_SHA:$TARGET_SHA" \
            --var "RELEASE_ORIGIN:$PREPRODUCTION_ORIGIN" \
            --var "SUPABASE_URL:$SUPABASE_URL" \
            --var "APP_URL:$PREPRODUCTION_ORIGIN" \
            --var "RESEND_FROM:$RESEND_FROM" \
            --var "WHATSAPP_ENABLED:$WHATSAPP_ENABLED" \
            --var "WHATSAPP_API_VERSION:$WHATSAPP_API_VERSION" \
            --keep-vars \
            --strict
          for attempt in {1..10}; do
            version_id=$(bunx wrangler versions list --config wrangler.preproduction.generated.jsonc --name "$PREPRODUCTION_WORKER_NAME" --json | jq -r --arg tag "$PREPROD_TAG" '[.[] | select(.annotations["workers/tag"] == $tag)] | last | .id')
            if [[ -n "$version_id" && "$version_id" != "null" ]]; then break; fi
            sleep 3
          done
          if [[ -z "$version_id" || "$version_id" == "null" ]]; then
            echo "Could not resolve uploaded version tag $PREPROD_TAG"
            exit 1
          fi
          echo "version_id=$version_id" >> "$GITHUB_OUTPUT"
      - name: Serve the pre-production version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERSION_ID: ${{ steps.upload.outputs.version_id }}
          PREPROD_TAG: ${{ steps.identity.outputs.tag }}
        run: |
          bunx wrangler versions deploy \
            "$VERSION_ID@100" \
            --config wrangler.preproduction.generated.jsonc \
            --name "$PREPRODUCTION_WORKER_NAME" \
            --message "Serve pre-production gate $PREPROD_TAG" \
            --yes
      - name: Run pre-production health and readiness smoke
        env:
          SMOKE_BASE_URL: ${{ env.PREPRODUCTION_ORIGIN }}
          SMOKE_EXPECTED_VERSION_ID: ${{ steps.upload.outputs.version_id }}
          SMOKE_EXPECTED_RELEASE: ${{ steps.identity.outputs.tag }}
          PREPRODUCTION_ACCESS_CLIENT_ID: ${{ secrets.PREPRODUCTION_ACCESS_CLIENT_ID }}
          PREPRODUCTION_ACCESS_CLIENT_SECRET: ${{ secrets.PREPRODUCTION_ACCESS_CLIENT_SECRET }}
        run: bun run scripts/retry-release-smoke.ts health
      - name: Run the agreed public journeys through pre-production
        env:
          SMOKE_BASE_URL: ${{ env.PREPRODUCTION_ORIGIN }}
          SMOKE_EXPECTED_VERSION_ID: ${{ steps.upload.outputs.version_id }}
          SMOKE_EXPECTED_RELEASE: ${{ steps.identity.outputs.tag }}
          SMOKE_JOURNEY_PATHS: ${{ env.PREPRODUCTION_JOURNEY_PATHS }}
          PREPRODUCTION_ACCESS_CLIENT_ID: ${{ secrets.PREPRODUCTION_ACCESS_CLIENT_ID }}
          PREPRODUCTION_ACCESS_CLIENT_SECRET: ${{ secrets.PREPRODUCTION_ACCESS_CLIENT_SECRET }}
        run: bun run scripts/retry-release-smoke.ts journey
      - name: Record pre-production gate outcome
        if: always()
        env:
          VERSION_ID: ${{ steps.upload.outputs.version_id }}
          PREPROD_TAG: ${{ steps.identity.outputs.tag }}
          OUTCOME: ${{ job.status }}
        run: |
          {
            echo "### Pre-production gate"
            echo "- Tag: ${PREPROD_TAG:-unresolved}"
            echo "- Cloudflare version: ${VERSION_ID:-not uploaded}"
            echo "- Outcome: ${OUTCOME:-unknown}"
          } >> "$GITHUB_STEP_SUMMARY"
