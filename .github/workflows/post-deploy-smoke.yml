name: Post-deploy health smoke

on:
  workflow_dispatch:
    inputs:
      deployment_origin:
        description: Public origin of the deployment to verify
        required: true
        type: string
  workflow_call:
    inputs:
      deployment_origin:
        description: Public origin of the deployment to verify
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: post-deploy-health-smoke-${{ inputs.deployment_origin }}
  cancel-in-progress: false

jobs:
  smoke:
    name: Verify deployed health
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SMOKE_BASE_URL: ${{ inputs.deployment_origin }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - name: Check liveness and database readiness
        run: bun run smoke:health
