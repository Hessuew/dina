name: Dependency security audit

on:
  pull_request:
    paths:
      - package.json
      - bun.lock
      - .github/dependabot.yml
      - .github/workflows/dependency-security.yml
  push:
    branches: [main]
    paths:
      - package.json
      - bun.lock
      - .github/dependabot.yml
      - .github/workflows/dependency-security.yml
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit Bun dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - name: Run high-severity dependency audit
        shell: bash
        run: |
          set +e
          bun audit --audit-level=high --json > bun-audit.json
          audit_status=$?
          set -e
          if [ ! -s bun-audit.json ]; then
            echo "Dependency audit did not produce a JSON report (exit $audit_status)."
            exit 1
          fi
          AUDIT_STATUS="$audit_status" node --input-type=module -e '
            import { readFileSync } from "node:fs"

            const report = JSON.parse(readFileSync("bun-audit.json", "utf8"))
            const findings = Object.entries(report).flatMap(([packageName, advisories]) =>
              advisories.map((advisory) => ({ packageName, ...advisory })),
            )
            const blocking = findings.filter(
              ({ severity }) => severity === "high" || severity === "critical",
            )

            if (blocking.length > 0) {
              console.error(
                `Dependency audit found ${blocking.length} high/critical advisory(s).`,
              )
              for (const finding of blocking) {
                console.error(`- ${finding.packageName}: ${finding.title}`)
              }
              process.exit(1)
            }

            if (Number(process.env.AUDIT_STATUS) !== 0) {
              console.log(
                "bun audit returned non-zero for below-threshold findings; no high/critical advisories were found.",
              )
            }
          '
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bun-dependency-audit
          path: bun-audit.json
          if-no-files-found: error
          retention-days: 14
