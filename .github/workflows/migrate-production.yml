name: Migrate Supabase production

on:
  push:
    branches: [production]
    paths:
      - 'drizzle/**'
  workflow_dispatch:

concurrency:
  group: supabase-production-migrations
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  migrate:
    name: Validate and migrate
    runs-on: ubuntu-latest
    environment: production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Require the latest green main release gate
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'main-release.yml',
              branch: 'main',
              per_page: 1,
            })
            const latest = data.workflow_runs[0]
            if (!latest || latest.status !== 'completed' || latest.conclusion !== 'success') {
              core.setFailed('The latest Main release gate is not green.')
            }
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - name: Validate the Drizzle migration chain
        run: bun run test:integration
      - name: Apply pending migrations to production
        run: bun run db:migrate
