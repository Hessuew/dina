name: No-mistakes required

on:
  # Trusted verifier only: never check out or execute pull-request code here.
  pull_request_target:
    branches: [main]
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: no-mistakes-required-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: PR must be raised via no-mistakes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify current-head pipeline attestation
        uses: kunchenguid/no-mistakes/.github/actions/require-no-mistakes@4822244e763fd4c3d7f48be6433f92df10bb5b33 # v1.84.0
        with:
          exempt-bot-authors: 'false'
          # Leave body/head inputs unset: fetch current PR facts, not cached event data.
